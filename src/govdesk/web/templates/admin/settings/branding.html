{% extends "admin/settings/_layout.html" %}
{% set active = "branding" %}

{% block settings_body %}
<div class="kern-card kern-card--hug">
  <div class="kern-card__container">
    <div class="kern-card__header">
      <h2 class="kern-heading-small"><i aria-hidden="true">badge</i> Branding</h2>
      <p class="kern-body--small kern-body--muted">Name und Untertitel der Plattform (Login- und Startseite).</p>
    </div>
    <div class="kern-card__body">
      <form method="post" action="/admin/settings/branding" class="gd-stack kern-w-full">
        <div class="kern-form-input">
          <label class="kern-label" for="branding-name">Plattform-Name</label>
          <input class="kern-form-input__input" type="text" id="branding-name" name="platform_name"
                 value="{{ platform_name }}" maxlength="80">
        </div>
        <div class="kern-form-input">
          <label class="kern-label" for="branding-untertitel">Untertitel (Login/Start, optional)</label>
          <input class="kern-form-input__input" type="text" id="branding-untertitel" name="platform_subtitle"
                 value="{{ platform_subtitle or '' }}" maxlength="160">
        </div>
        <div class="gd-dialog-actions">
          <button type="submit" class="kern-btn kern-btn--primary">
            <i aria-hidden="true">save</i><span class="kern-label">Speichern</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
